datasets:
  train:
    - gsm8k
    - math
    - in3
    - mintqa
    - or_bench
  eval: []
    # freshqa disabled for this run — per user; re-enable once tool finalize pass is validated.
    # - truthfulqa    # see CLAUDE.md §Change 6: enable once dataset/truthfulqa exists
    # - realtimeqa    # see CLAUDE.md §Change 6: enable once dataset/realtimeqa exists
  default_splits:
    gsm8k: train
    math: train
    in3: train
    mintqa: train
    or_bench: train
    # truthfulqa: validation
    # realtimeqa: test
  math_train_levels: [1, 2, 3]
  math_eval_levels: [4, 5]

rollout:
  # vllm = student model (default, required for the main experiment);
  # hf = student model via HuggingFace;
  # heuristic = oracle smoke/debug only (reads gold labels — NOT for production runs);
  # auto = prefer hf, fall back to heuristic only when allow_heuristic_fallback=true.
  backend: vllm
  limit_per_dataset: null
  prompt_mode: top_k                 # 02 rollout/mining uses top-k; 07 eval overrides to single_action
  max_new_tokens: 1024
  top_k_actions: 3                  # k=3; avoids degenerate full-action ranking
  min_candidate_count: 2            # discard if student produces < 2 unique action types
  candidate_temperature: 0.6
  candidate_top_p: 0.9
  candidate_top_k: 50
  repetition_penalty: 1.05
  vllm_gpu_memory_utilization: 0.85
  vllm_max_model_len: 4096
  # vLLM tensor parallelism. Keep 1 for single-card compatibility; use 2 or 4
  # with matching CUDA_VISIBLE_DEVICES on 24GB RTX 3090 runs.
  vllm_tensor_parallel_size: 1
  vllm_pipeline_parallel_size: 1
  allow_heuristic_fallback: false
  candidate_logprob_scoring:
    enabled: true
    prompt_logprobs: 1
    score_action_json_only: true
    normalize: mean
    use_prefix_caching: true
    fallback_full_vocab_on_missing: false
    entropy_temperature: 1.0
    low_margin_delta: 0.10
    high_entropy_threshold: 0.85
    confidence_high_threshold: 0.75
    logprob_low_percentile: 0.30
  heuristic_exploration_rate: 0.2   # heuristic policy only; was exploration_rate
  exploration_rate: 0.2             # backward-compat alias — do not remove
  allow_debug_fallback_branch: true
  use_fallback_branches_for_training: false  # debug fallback branches never enter training
  shallow: true
  max_branch_steps: 1
  search_mode_train: train
  search_mode_eval: eval

annotation:
  execute_tools: false              # training annotation: no real tool calls
  tool_finalize_pass: false         # no finalize pass during annotation
  score_sources:
    ANSWER: teacher_utility
    CALCULATE: teacher_utility
    CLARIFY: teacher_utility
    SEARCH: teacher_utility
    REFUSE: teacher_utility

eval:
  execute_tools: true               # eval: execute tools for real
  tool_finalize_pass: true          # run student finalize pass after tool observation
  tool_finalize_depth: 2            # post-tool finalize passes; 2 allows initial action + one additional tool action + final answer
  max_branch_steps: 2
  prompt_mode: decision_window      # default eval mirrors DPO: question + original reasoning_attempt -> decision
  candidate_temperature: 0.2
  repetition_penalty: 1.05

tools:
  calculator:
    backend: safe_eval              # training/annotation default; eval overrides below
    backend_eval: python_sandbox    # eval executes restricted Python math snippets in a child process
    timeout_sec: 3.0
    memory_mb: 512
    output_max_chars: 512

calibration:
  enabled: true
  sample_size: 300
  input_split: "train_heldout"
  output_dir: "artifacts_v02/calibration"
  min_spearman: 0.5
  min_argmax_hit_rate: 0.6
  min_per_action_auc: 0.6
  per_action_breakdown:
    - ANSWER_vs_non_ANSWER
    - SEARCH
    - CLARIFY
    - REFUSE
    - CALCULATE

scoring:
  # Legacy compatibility only. v0.2.6 U_rel does not multiply teacher score by
  # base_value; it uses score - action_cost + semantic_bonus + action_prior.
  base_value:
    ANSWER: 1.0
    SEARCH: 0.6
    CALCULATE: 0.6
    CLARIFY: 0.5
    REFUSE: 0.4
  action_cost:
    SEARCH: 0.10      # lambda_tool
    CALCULATE: 0.05   # lambda_calc
    CLARIFY: 0.10     # lambda_clar
    ANSWER: 0.0
    REFUSE: 0.0
  action_prior:
    ANSWER: 0.0
    SEARCH: 0.0
    CALCULATE: 0.0
    CLARIFY: 0.0
    REFUSE: 0.0
  # semantic_bonus: only semantic tag keys are allowed here.
  # Process features (STRUGGLE_LONG, LOW_CANDIDATE_LOGPROB_MARGIN, etc.) MUST NOT appear here.
  semantic_bonus:
    SEARCH_REQUIRED_SEARCH: 0.05
    TIME_SENSITIVE_SEARCH: 0.05
    NEW_OR_TAIL_KNOWLEDGE_SEARCH: 0.05
    CALCULATION_REQUIRED_CALCULATE: 0.05
    CLARIFY_REQUIRED_CLARIFY: 0.05
    FALSE_PREMISE_REFUSE: 0.05
    JUSTIFIED_REFUSE_REFUSE: 0.05
    cap_per_candidate: 0.15
  # Legacy flat keys for backward compatibility with old utility.py loader.
  lambda_tool: 0.10
  lambda_calc: 0.05
  lambda_clar: 0.10
  answer_correct: 1.0
  answer_wrong: -1.0
  refuse_justified: 0.4
  refuse_unjustified: -0.6
  search_helpful: 0.6
  search_unhelpful: -0.1
  calculate_helpful: 0.6
  calculate_unhelpful: -0.1
  clarify_helpful: 0.5
  clarify_unhelpful: -0.1

pair_construction:
  prompt_mode: decision_window      # default: state-conditioned action alignment; use end_to_end for full reasoning+decision
  min_utility_gap: 0.2              # gap between chosen and rejected U_rel
  min_utility_gap_default: 0.20
  min_utility_gap_by_dataset:
    gsm8k: 0.20
    math: 0.20
    in3: 0.10
    mintqa: 0.10
    or_bench: 0.15
  min_utility_gap_by_chosen_action:
    SEARCH: 0.10
    CLARIFY: 0.10
    REFUSE: 0.15
    CALCULATE: 0.20
    ANSWER: 0.20
  require_different_action_types: true
  truncate_at_action_emission: true  # training pairs end at action emission; no tool obs/finalize
  augmentation:
    enabled: true
    # Add weak decision-window pairs from records that were too close for the
    # normal hard-gap filter. Primary range is 0.10-0.20; if that is short of
    # max_pairs, fallback fills from 0.05-0.10 with the same weak weight.
    near_tie:
      enabled: true
      max_pairs: 600
      primary_min_gap: 0.10
      fallback_min_gap: 0.05
      max_gap: 0.20
      sample_weight: 0.40
      require_different_action_types: true
    # Add best-vs-middle pairs from 3-candidate decision windows. IN3 is
    # intentionally favored; MintQA is excluded because its best-mid pool mostly
    # reinforces SEARCH > ANSWER rather than the desired ANSWER > SEARCH signal.
    best_mid:
      enabled: true
      max_pairs: 1500
      min_gap: 0.10
      sample_weight: 0.70
      require_different_action_types: true
      fill_remaining: false
      dataset_quota:
        in3: 1000
  post_filter:
    enabled: true
    # Final pair-level quota. Small MintQA buckets are kept, while dominant
    # search-heavy buckets are capped so MintQA lands near 2k total pairs.
    action_pair_quota_by_dataset:
      gsm8k:
        CALCULATE>ANSWER: 550
      math:
        CALCULATE>ANSWER: 515
      mintqa:
        SEARCH>REFUSE: 1000
        SEARCH>ANSWER: 900
  balance:
    dataset_quota:
      gsm8k: 0.15
      math: 0.20
      in3: 0.20
      mintqa: 0.20
      or_bench: 0.25
    chosen_action_quota:
      ANSWER: 0.25
      CALCULATE: 0.20
      SEARCH: 0.20
      CLARIFY: 0.15
      REFUSE: 0.20


features:
  long_reason_token_threshold: 80

tools:
  search:
    backend: local_retriever
    train_backend: local_retriever
    eval_backend: serper
    top_k: 3
    enable_online_backend: true
    online_timeout_seconds: 30
    country_code: us
    language_code: en
    serper_base_url: https://google.serper.dev/search
    brave_api_key_env: BRAVE_SEARCH_API_KEY
    brave_base_url: https://api.search.brave.com/res/v1/web/search
    tavily_api_key_env: TAVILY_API_KEY
    tavily_base_url: https://api.tavily.com/search
    tavily_search_depth: basic
    tavily_topic: general
    exa_api_key_env: EXA_API_KEY
    exa_base_url: https://api.exa.ai/search
    exa_search_type: auto
    cache_path: ./artifacts/reports/search_cache.json
    corpus_path: ./artifacts/reports/local_search_corpus.json
    index_path: ./artifacts/reports/local_search_index.json
    index_split: all
    max_docs_per_dataset: 400
    min_score: 0.0
  calculator:
    mode: safe_python
  clarify:
    mode: oracle_once
  refuse:
    mode: terminal
