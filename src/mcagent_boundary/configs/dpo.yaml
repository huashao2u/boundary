action_space:
  - ANSWER
  - SEARCH
  - CALCULATE
  - CLARIFY
  - REFUSE

scoring:
  lambda_tool: 0.10
  lambda_calc: 0.05
  lambda_clar: 0.10
  answer_correct: 1.0
  answer_wrong: -1.0
  refuse_justified: 0.4
  refuse_unjustified: -0.6
  search_helpful: 0.6
  search_unhelpful: -0.1
  calculate_helpful: 0.6
  calculate_unhelpful: -0.1
  clarify_helpful: 0.5
  clarify_unhelpful: -0.1

mining:
  min_delta_u: 0.5
  boundary_threshold_default: 0.5
  boundary_threshold_by_dataset:
    gsm8k: 0.55
    math: 0.50
    in3: 0.45
    mintqa: 0.55
    or_bench: 0.45
  competition_window: 0.35
  anchor_margin: 0.5
  max_boundary_candidates: 9000
  max_clear_answer_anchors: 740
  max_clear_external_anchors: 260
  sampling:
    redistribute_unused: true
    boundary_quota_by_dataset:
      gsm8k: 2000
      math: 2000
      in3: 1100
      mintqa: 3000
      or_bench: 900
    clear_answer_quota_by_dataset:
      gsm8k: 20
      math: 40
      in3: 40
      mintqa: 0
      or_bench: 640
    clear_external_quota_by_dataset:
      gsm8k: 25
      math: 25
      in3: 25
      mintqa: 75
      or_bench: 110
  soft_boundary_from_other:
    enabled: false
    threshold_default: 0.45
    threshold_by_dataset:
      gsm8k: 0.45
      math: 0.45
      in3: 0.40
      mintqa: 0.45
      or_bench: 0.35
  boundary_score_weights:
    low_u_rel_margin: 0.25
    action_diversity: 0.15
    low_candidate_logprob_margin: 0.15
    rank_disagreement: 0.10
    high_score_entropy: 0.10
    confidence_logprob_mismatch: 0.10
    semantic_pressure: 0.15

warmup:
  enable_if_non_answer_rate_below: 0.15
  min_examples: 500
  max_examples: 1000

training:
  beta: 0.1
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 5.0e-6
  num_train_epochs: 1
  max_steps: 200
  eval_steps: 25
  save_steps: 50
  logging_steps: 5
  warmup_steps: 10
  max_length: 1024
  truncation_mode: keep_end
  bf16: false
  fp16: true
  gradient_checkpointing: true
  ddp_find_unused_parameters: false
  smoke_max_steps: 2
  report_to: []
  use_sample_weights: true
  lora:
    enabled: true
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - up_proj
      - down_proj
      - gate_proj

evaluation:
  confidence_default: 0.5
