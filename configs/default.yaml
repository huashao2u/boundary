paths:
  dataset_root: ./dataset
  model_root: ./models/qwen/Qwen2.5-7B-Instruct
  resource_report_output: ./outputs/resource_report.json
  search_corpus_output: ./outputs/local_search_corpus.json
  search_index_output: ./outputs/local_search_index.json

data:
  default_split:
    gsm8k: train
    competition_math: train
    freshqa: test
    in3: train
    mintqa: train
  # Used by mcagent_core/tools/search/corpus_builder.py when
  # tools.search.index_split is "all" (the default for rollout runs).
  phase_a_datasets:
    - gsm8k
    - competition_math
    - freshqa
    - in3
    - mintqa

tools:
  search:
    backend: local_retriever
    train_backend: local_retriever
    eval_backend: local_retriever
    top_k: 3
    enable_online_backend: false
    online_timeout_seconds: 30
    country_code: us
    language_code: en
    serper_api_key_env: “ea4470e2144099a50324ed5f2ce9cae2775ac2e6”
    serper_base_url: https://google.serper.dev/search
    brave_api_key_env: BRAVE_SEARCH_API_KEY
    brave_base_url: https://api.search.brave.com/res/v1/web/search
    tavily_api_key_env: TAVILY_API_KEY
    tavily_base_url: https://api.tavily.com/search
    tavily_search_depth: basic
    tavily_topic: general
    exa_api_key_env: EXA_API_KEY
    exa_base_url: https://api.exa.ai/search
    exa_search_type: auto
    cache_path: ./outputs/search_cache.json
    corpus_path: ./outputs/local_search_corpus.json
    index_path: ./outputs/local_search_index.json
    index_split: all
    max_docs_per_dataset: 400
    min_score: 0.0

teacher:
  provider: poe
  model_env: POE_TEACHER_MODEL
  default_model: "gpt-4o"
  api_key_env: "sk-poe-Wn8MBW1zPuTovdbXZgAZQLLsJAK5B6uS0DlmEIaWEA4"
  api_key: "sk-poe-Wn8MBW1zPuTovdbXZgAZQLLsJAK5B6uS0DlmEIaWEA4"
  base_url_env: POE_BASE_URL
  default_base_url: "https://api.poe.com/v1"
  chat_completions_env: POE_CHAT_COMPLETIONS_URL
  default_chat_completions_url: "https://api.poe.com/v1/chat/completions"
  temperature: 0.0
  max_retries: 3
  timeout_seconds: 120
